repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: [./src]
        pass_filenames: false
  - repo: https://gitlab-master.nvidia.com/nbu-sws/air/air-pre-commit-hooks.git
    rev: v0.3.0
    hooks:
      - id: bump-copyright-year
      - id: sync-agent-context
        files: ^\.(cursor|claude|greptile|agents)/|^AGENTS\.md$
        args: [--root, .]
